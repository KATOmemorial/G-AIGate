# G-AIGate 配置模板（10.1 §3）
# 与全部默认值一一对应：本文件即配置项自文档。
# 复制为 config.yaml 后按需修改；未出现的项走默认值。
# 环境变量覆盖规则：GAIGATE_<SECTION>_<FIELD>（01-工程规范 §1）。
# 敏感项不入配置文件：mysql.password 与 secret.master-key 只认环境变量，写在本文件中会导致启动失败。

server:
  addr: ":8080"            # 网关监听地址
  metrics-addr: ":9101"     # Prometheus 抓取地址（compose 已按此配置）
  shutdown-timeout: 60s     # 优雅关闭等待上限（10.2）

log:
  level: info              # debug|info|warn|error，严格小写

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  database: gaigate
  # password：仅环境变量 GAIGATE_MYSQL_PASSWORD，不得写入配置文件

redis:
  addr: 127.0.0.1:6379
  db: 0

proxy:
  ttfb-timeout: 10s       # 首字节超时（15.2）
  overall-timeout: 300s   # 整体超时（15.2）
  stream-buffer: 64       # 有界缓冲 chunk 数（15.2）

channel:
  probe-interval: 30s     # 探活间隔（14.3）
  failure-threshold: 5    # 连续失败→禁用阈值（14.3）
  disable-duration: 60s   # 禁用冷却时长（14.3）

router:
  breaker-window: 60s             # 熔断滑动窗口（16.3）
  breaker-min-samples: 20         # 熔断最小样本数（16.3）
  breaker-err-threshold: 0.5      # 熔断错误率阈值，(0,1]（16.3）
  breaker-open-duration: 30s      # open→half-open 时长（16.3）
  default-strategy: weighted     # weighted|cost_first|latency_first|fallback_chain（16.2）

meter:
  estimate-chars-per-token: 4    # 估算回退：每 token 字符数（17.1）
  settle-queue-size: 1024        # 落账队列长度（11.3）

secret:
  # master-key：仅环境变量 GAIGATE_SECRET_MASTER_KEY（base64，解码后恰 32 字节，AES-256）
  # 生产生成命令：openssl rand -base64 32
